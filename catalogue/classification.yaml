# TPAC asset classification.
# Group > Class > Type. Types differ by working principle; size, rating, voltage,
# material, make and installation arrangement are attributes, never types.
# A classification is written as <class> or <class>.<type>, e.g. pump.radial-flow.
# `national` gives the Iranian MIMS group.class(.type) code where the meaning is identical.

catalogue: classification
version: 0.3.0

