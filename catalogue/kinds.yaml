# TPAC kind catalogue.
# A kind names the role of a position: what sort of thing is installed there.
# Kinds are named by function class, never by process service: a return-sludge pump
# and a raw-water pump are both PU; the unit says which service it is in.
#
# placement:   where a position of this kind may appear.
#              unit   = directly under a unit (an equipment position)
#              parent = as a child of another position whose kind lists it in `children`
# children:    the kinds that may appear as children of this kind. A child exists only
#              to make its parent work (drive, power, control, protect, monitor, support
#              or serve it). See spec/03-placement-rules.md.
# population:  true when one position may stand for a group of identical items (quantity > 1).
# asset_classes:     classification classes allowed for the asset installed in the position.
# structure_classes: civil classes recorded on the position itself (structures are not assets).

catalogue: kinds
version: 0.3.0

families:
  - id: structure
    name: {en: Structures, fa: سازه‌ها}
  - id: process
    name: {en: Process machinery, fa: ماشین‌آلات فرایندی}
  - id: flow-control
    name: {en: Valves and gates, fa: شیرآلات و دریچه‌ها}
  - id: electrical
    name: {en: Electrical, fa: برق}
  - id: instrumentation
    name: {en: Instrumentation and control, fa: ابزار دقیق و کنترل}
  - id: ict
    name: {en: Communication and IT, fa: ارتباطات و فناوری اطلاعات}
  - id: building-services
    name: {en: Building services, fa: تأسیسات ساختمان}
  - id: safety
    name: {en: Safety and fire, fa: ایمنی و آتش‌نشانی}
  - id: laboratory
    name: {en: Laboratory, fa: آزمایشگاه}
  - id: lifting
    name: {en: Lifting and handling, fa: بالابر و جابجایی}
  - id: workshop
    name: {en: Workshop, fa: تعمیرگاه}

