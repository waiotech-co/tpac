# Mapping from the Iranian national wastewater equipment coding (MIMS) to TPAC.
# Source: national coding instruction of the national wastewater maintenance working group
# (Autumn 1402), unit list "LL" edition.
# A mapping with several targets, or with `decide: site`, needs a decision per plant.

mapping: iran-mims
version: 0.1.0

national_code_structure: >-
  company(2) plant(2) unit-category(2) unit(2) equipment-token(2) equipment-number(2)
  group(2) class(2) type(2) device-number(2)

units:
  LL01: {to: SR, name: آشغالگیر}
